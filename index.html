<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6ece3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Brain">
<title>My Brain</title>
<style>
:root{--bg:#f6ece3;--card:#fffaf4;--ink:#1a1a1a;--gold:#c9a15a;--mute:#7a7266;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.frame{border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:4px;border-radius:14px;padding:18px 12px;margin:6px 5px;background:var(--card)}
header{text-align:center}
.logo{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;margin:0 auto;background:var(--bg)}
.logo img{width:142%;margin:-21% 0 0 -21%;display:block}
h1{margin:8px 0 2px;font-size:28px;letter-spacing:.5px}
.sub0{color:var(--mute);font-size:14px;margin-bottom:12px;font-style:italic}
.seg{display:flex;border:1.5px solid var(--gold);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:10px 2px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px}
.seg .on{background:var(--ink);color:var(--card)}
.add{display:flex;gap:8px;margin:10px 0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--gold);border-radius:10px;padding:11px 12px;width:100%}
select{width:auto;padding:7px 10px;font-size:15px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:0 16px;font-weight:bold}
.sortrow{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin-bottom:4px}
details{border:1.5px solid var(--gold);border-radius:10px;padding:9px 12px;margin-bottom:10px}
summary{cursor:pointer}
.flash{color:#9a3b2e;font-size:14px;min-height:0}
.sec{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.task{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px dotted var(--gold)}
.star{flex:none;background:none;border:0;color:var(--gold);font-size:24px;line-height:1;padding:0 2px}
.box{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:5px;background:none;color:var(--ink);font-size:19px;line-height:1;padding:0}
.box.sm{width:22px;height:22px;font-size:16px}
.title{flex:1;min-width:0;font-size:17px;cursor:pointer;overflow-wrap:anywhere}
.due{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.late .due{color:#9a3b2e}
.done .title{text-decoration:line-through;color:var(--mute)}
.dot{color:var(--gold);font-size:11px}
.zz,.snz button,.mini{font-size:12px;border:1px solid var(--gold);background:none;border-radius:8px;color:var(--ink);padding:5px 7px}
.snz{display:flex;gap:4px}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-style:italic}
.back{background:none;border:0;color:var(--ink);font-size:16px;padding:0 0 10px}
h2{margin:0 0 10px;font-size:24px}
.pri{border:1.5px solid var(--gold);background:none;border-radius:10px;padding:7px 10px;color:var(--ink);white-space:nowrap}
textarea{min-height:120px;resize:vertical}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--ink);background:none;color:var(--ink)}
.row .del{border-color:#9a3b2e;color:#9a3b2e}
.gcal{display:inline-block;margin-top:10px;color:var(--ink);font-size:15px;border-bottom:1.5px solid var(--gold);text-decoration:none}
.chips{display:flex;gap:8px;margin-top:8px;align-items:center;font-size:14px;color:var(--mute);flex-wrap:wrap}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--gold)}
.subrow span{flex:1;overflow-wrap:anywhere}
.subrow.done span{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;font-size:22px;color:var(--mute);padding:0 6px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-size:18px}.mh button{background:none;border:0;font-size:26px;color:var(--ink);padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px}
.day i{font-style:normal;color:var(--gold);font-size:10px;height:10px;line-height:10px}
.today{border-color:var(--gold)}
.sel{background:var(--ink);color:var(--card)}
.wday{width:100%;display:flex;justify-content:space-between;text-align:left;background:none;border:0;border-bottom:1.5px solid var(--gold);padding:9px 4px;margin-top:10px;color:var(--ink);font-size:15px}
.selday{background:var(--bg);font-weight:bold}
.chev{color:var(--gold);font-size:22px}
.bar{height:8px;border:1px solid var(--gold);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0}
.hide{display:none}
</style></head><body>
<div class="wrap"><div class="frame">
<div id="main">
 <header><div class="logo"><img src="icon-192.png" alt="My Brain"></div><h1>My Brain</h1><div class="sub0" id="count"></div></header>
 <div class="seg"><button id="v_today">Today</button><button id="v_week">Week</button><button id="v_list">List</button><button id="v_cal">Month</button><button id="v_proj">Projects</button></div>
 <div id="sortBox" class="sortrow hide">Sort by
  <select id="sort"><option value="star">Priority first</option><option value="due">Due date</option><option value="new">Newest</option><option value="az">A–Z</option></select></div>
 <div id="weekBox" class="hide"><div class="mh"><button data-wk="-1" aria-label="Previous week">‹</button><b id="wTitle"></b><button data-wk="1" aria-label="Next week">›</button></div></div>
 <div id="calBox" class="hide">
  <div class="mh"><button data-nav="-1" aria-label="Previous month">‹</button><b id="mTitle"></b><button data-nav="1" aria-label="Next month">›</button></div>
  <div class="grid" id="grid"></div>
  <label id="selLabel"></label>
 </div>
 <div class="add"><input id="new" placeholder="Add a task…" maxlength="120"><button class="btn" id="addBtn">Add</button></div>
 <div class="flash" id="flash"></div>
 <div id="tasks"></div>
</div>
<div id="detail" class="hide">
 <button class="back" id="back">‹ Back</button>
 <h2 id="dTitleH"></h2>
 <div class="chips" style="margin:0 0 6px"><button class="pri" id="dStar"></button><button class="pri" id="dFocus"></button></div>
 <label>Task</label><input id="dTitle" maxlength="120">
 <label>Due date</label><input id="dDue" type="date">
 <div class="chips">Snooze: <button class="mini" data-dz="1">Tomorrow</button><button class="mini" data-dz="7">Next week</button></div>
 <a class="gcal hide" id="gcal" target="_blank" rel="noopener">+ Add to Google Calendar</a>
 <label id="subLabel">Steps</label>
 <div id="subs"></div>
 <div class="add"><input id="subNew" placeholder="Add a step…" maxlength="100"><button class="btn" id="subAdd">Add</button></div>
 <label>Project</label><select id="dProj" style="width:100%"></select>
 <label>Description</label><textarea id="dDesc" placeholder="Add details, notes, links…"></textarea>
 <div class="row"><button id="dDone"></button><button class="del" id="dDel">Delete</button></div>
</div>
<div id="pdetail" class="hide">
 <button class="back" id="pBack">‹ Back</button>
 <h2 id="pTitleH"></h2>
 <div class="bar"><i id="pBar"></i></div><div class="chips" id="pProg"></div>
 <label>Name</label><input id="pName" maxlength="80">
 <label>Description</label><textarea id="pDesc" placeholder="What is this project about?"></textarea>
 <label>Status</label><select id="pStatus" style="width:100%"><option>Active</option><option>On hold</option><option>Done</option></select>
 <label>Target date</label><input id="pDue" type="date">
 <label>Notes &amp; links</label><textarea id="pNotes" placeholder="Anything else: links, contacts, ideas…"></textarea>
 <label>Tasks</label><div id="pTasks"></div>
 <div class="add"><input id="pNew" placeholder="Add a task to this project…" maxlength="120"><button class="btn" id="pAdd">Add</button></div>
 <div class="row"><button class="del" id="pDel">Delete project</button></div>
</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
let tasks=[],projects=[],cur=null,curP=null,backP=false,view='today',month=new Date(),sel=today,snz=null,sort='star',armed=false,armedP=false,wk=0,pick=false;
month.setDate(1);
try{tasks=JSON.parse(localStorage.getItem('tickoff')||'[]');sort=localStorage.getItem('tickoff-sort')||'star';projects=JSON.parse(localStorage.getItem('tickoff-proj')||'[]')}catch(e){}
if(!Array.isArray(projects))projects=[];
if(!Array.isArray(tasks))tasks=[];
if(!['star','due','new','az'].includes(sort))sort='star';
$('sort').value=sort;
const save=()=>{try{localStorage.setItem('tickoff',JSON.stringify(tasks))}catch(e){}};
const saveP=()=>{try{localStorage.setItem('tickoff-proj',JSON.stringify(projects))}catch(e){}};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const nice=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})};
const T=id=>tasks.find(x=>x.id===id);
const dk=t=>t.due||'9999-99-99';
let ft;const flash=m=>{$('flash').textContent=m;clearTimeout(ft);ft=setTimeout(()=>$('flash').textContent='',2500)};
function ordered(arr){
 return arr.map((t,i)=>[t,i]).sort((x,y)=>{const a=x[0],b=y[0];
  if(!!a.done!==!!b.done)return a.done?1:-1;
  let r=0;
  if(sort==='star')r=(b.star?1:0)-(a.star?1:0)||dk(a).localeCompare(dk(b));
  else if(sort==='due')r=dk(a).localeCompare(dk(b));
  else if(sort==='az')r=a.title.localeCompare(b.title);
  return r||x[1]-y[1]}).map(x=>x[0])}
function row(t){
 const late=!t.done&&t.due&&t.due<today,subs=t.subs||[],sd=subs.filter(s=>s.d).length;
 const pn=(projects.find(p=>p.id===t.proj)||{}).name;const meta=[pn||'',subs.length?sd+'/'+subs.length+' steps':'',t.due?(late?'Overdue · ':'')+nice(t.due):''].filter(Boolean).join(' · ');
 const act=pick?`<button class="zz" data-focus="${t.id}">${t.focus===today?'◎ Focused':'○ Focus'}</button>`:snz===t.id?`<span class="snz"><button data-snz="${t.id}:1">Tmrw</button><button data-snz="${t.id}:7">+1 wk</button><button data-snz="${t.id}:x" aria-label="Cancel">✕</button></span>`:`<button class="zz" data-zz="${t.id}">Snooze</button>`;
 return `<div class="task ${t.done?'done':''} ${late?'late':''}"><button class="star" data-star="${t.id}" aria-label="Priority">${t.star?'★':'☆'}</button><button class="box" data-tick="${t.id}" aria-label="Toggle done">${t.done?'✓':''}</button><span class="title" data-open="${t.id}">${esc(t.title)} ${t.desc?'<span class="dot">●</span>':''}${meta?`<span class="due">${meta}</span>`:''}</span>${t.done?'':act}</div>`}
const sec=(a,b='')=>`<div class="sec"><span>${a}</span>${b}</div>`;
function weekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay()+wk*7);return d}
function render(){
 const open=tasks.filter(t=>!t.done).length,dueN=tasks.filter(t=>!t.done&&t.due&&t.due<=today).length;
 $('count').textContent=tasks.length?open+' to do · '+dueN+' due today':'Nothing yet';
 ['today','week','list','cal','proj'].forEach(v=>$('v_'+v).className=view===v?'on':'');
 $('calBox').classList.toggle('hide',view!=='cal');
 $('weekBox').classList.toggle('hide',view!=='week');
 $('sortBox').classList.toggle('hide',view!=='list');
 $('new').placeholder=view==='proj'?'Add a project…':'Add a task…';
 let h='';
 if(view==='proj'){h=projHtml()}
 else if(view==='list'){const s=ordered(tasks);h=s.length?s.map(row).join(''):'<div class="empty">All clear. Add your first task above.</div>'}
 else if(view==='today'){
  if(pick){h=sec('Pick tasks for today','<button class="mini" data-pick="0">Done</button>')+ordered(tasks.filter(t=>!t.done)).map(row).join('')}
  else{
   const foc=ordered(tasks.filter(t=>t.focus===today&&!t.done)),fdone=tasks.some(t=>t.focus===today&&t.done);
   const rest=ordered(tasks.filter(t=>!t.done&&t.due&&t.due<=today&&t.focus!==today));
   h=sec('Today’s focus','<button class="mini" data-pick="1">Choose</button>')+(foc.length?foc.map(row).join(''):`<div class="empty">${fdone?'Focus tasks all done.':'Choose tasks to focus on today.'}</div>`);
   if(rest.length)h+=sec('Due & overdue')+rest.map(row).join('');
  }}
 else if(view==='week'){
  const st=weekStart(),days=[...Array(7)].map((_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);return d});
  const ks=days.map(ymd);if(!ks.includes(sel))sel=wk===0?today:ks[0];
  const f=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  $('wTitle').textContent=f(days[0])+' – '+f(days[6]);
  h=days.map(d=>{const k=ymd(d),l=ordered(tasks.filter(t=>t.due===k)),o=l.filter(t=>!t.done).length;
   return `<button class="wday ${k===sel?'selday':''}" data-wday="${k}"><span>${k===today?'Today · ':''}${d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</span><span>${o||''}</span></button>`+l.map(row).join('')}).join('');
 }else{
  $('mTitle').textContent=month.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const first=month.getDay(),n=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
  let g=['S','M','T','W','T','F','S'].map(x=>`<div class="dow">${x}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){const k=month.getFullYear()+'-'+pad(month.getMonth()+1)+'-'+pad(d);
   const c=tasks.filter(t=>t.due===k&&!t.done).length;
   g+=`<button class="day ${k===today?'today':''} ${k===sel?'sel':''}" data-day="${k}">${d}<i>${c?'●'.repeat(Math.min(c,3)):''}</i></button>`}
  $('grid').innerHTML=g;$('selLabel').textContent=nice(sel);
  const s=ordered(tasks.filter(t=>t.due===sel));h=s.length?s.map(row).join(''):'<div class="empty">Nothing planned for this day.</div>'}
 $('tasks').innerHTML=h;
}
function add(){const v=$('new').value.trim();if(!v)return;
 if(view==='proj'){const p={id:Date.now().toString(36),name:v,desc:'',status:'Active',due:'',notes:''};projects.unshift(p);$('new').value='';saveP();openProj(p.id);return}
 tasks.unshift({id:Date.now().toString(36),title:v,desc:'',done:false,star:false,subs:[],due:view==='cal'||view==='week'?sel:view==='today'?today:''});
 $('new').value='';save();render()}
$('addBtn').onclick=add;$('new').onkeydown=e=>{if(e.key==='Enter')add()};
['today','week','list','cal','proj'].forEach(v=>$('v_'+v).onclick=()=>{view=v;snz=null;pick=false;render()});
$('sort').onchange=()=>{sort=$('sort').value;try{localStorage.setItem('tickoff-sort',sort)}catch(e){}render()};
$('main').onclick=e=>{
 const g=a=>e.target.closest('['+a+']');
 const k=g('data-tick'),o=g('data-open'),d=g('data-day'),n=g('data-nav'),s=g('data-star'),z=g('data-zz'),sn=g('data-snz'),fo=g('data-focus'),pk=g('data-pick'),w=g('data-wk'),wd=g('data-wday'),po=g('data-popen');
 if(k){const t=T(k.dataset.tick);t.done=!t.done;save();render()}
 else if(s){const t=T(s.dataset.star);t.star=!t.star;save();render()}
 else if(z){snz=z.dataset.zz;render()}
 else if(sn){const[id,dd]=sn.dataset.snz.split(':');if(dd!=='x'){T(id).due=addDays(Number(dd));save()}snz=null;render()}
 else if(fo){const t=T(fo.dataset.focus);if(t.focus===today)t.focus='';else t.focus=today;save();render()}
 else if(pk){pick=pk.dataset.pick==='1';render()}
 else if(w){wk+=Number(w.dataset.wk);render()}
 else if(wd){sel=wd.dataset.wday;render()}
 else if(po){openProj(po.dataset.popen)}
 else if(o){snz=null;openTask(o.dataset.open)}
 else if(d){sel=d.dataset.day;render()}
 else if(n){month=new Date(month.getFullYear(),month.getMonth()+Number(n.dataset.nav),1);render()}};
function gcal(){const v=$('dDue').value,a=$('gcal');
 if(!v){a.classList.add('hide');return}
 const[y,m,d]=v.split('-').map(Number),nx=new Date(y,m-1,d+1),f=s=>s.replace(/-/g,'');
 a.href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent($('dTitle').value||cur.title)+'&details='+encodeURIComponent($('dDesc').value)+'&dates='+f(v)+'/'+f(ymd(nx));
 a.classList.remove('hide')}
$('dDue').onchange=gcal;$('dTitle').oninput=gcal;
function drawSubs(){const s=cur.subs;
 $('subs').innerHTML=s.map((x,i)=>`<div class="subrow ${x.d?'done':''}"><button class="box sm" data-sd="${i}">${x.d?'✓':''}</button><span>${esc(x.t)}</span><button class="x" data-sx="${i}" aria-label="Remove">×</button></div>`).join('');
 $('subLabel').textContent='Steps'+(s.length?' · '+s.filter(x=>x.d).length+' of '+s.length+' done':'')}
function addSub(){const v=$('subNew').value.trim();if(!v)return;cur.subs.push({t:v,d:false});$('subNew').value='';drawSubs()}
$('subAdd').onclick=addSub;$('subNew').onkeydown=e=>{if(e.key==='Enter')addSub()};
const chipTxt=()=>{$('dStar').textContent=cur.star?'★ Priority':'☆ Priority';$('dFocus').textContent=cur.focus===today?'◎ Focus today':'○ Focus today'};
$('dStar').onclick=()=>{cur.star=!cur.star;chipTxt()};
$('dFocus').onclick=()=>{if(cur.focus===today)cur.focus='';else cur.focus=today;chipTxt()};
$('detail').onclick=e=>{
 const g=a=>e.target.closest('['+a+']');
 const sd=g('data-sd'),sx=g('data-sx'),dz=g('data-dz');
 if(sd){const s=cur.subs[+sd.dataset.sd];s.d=!s.d;drawSubs()}
 else if(sx){cur.subs.splice(+sx.dataset.sx,1);drawSubs()}
 else if(dz){$('dDue').value=addDays(Number(dz.dataset.dz));gcal()}};
function openTask(id,fp){backP=!!fp;cur=T(id);if(!cur)return;cur.subs=cur.subs||[];
 $('dTitleH').textContent=cur.title;$('dTitle').value=cur.title;$('dDesc').value=cur.desc;$('dDue').value=cur.due||'';
 gcal();chipTxt();drawSubs();
 $('dProj').innerHTML='<option value="">None</option>'+projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('dProj').value=cur.proj||'';
 $('dDone').textContent=cur.done?'Mark not done':'Mark done ✓';armed=false;$('dDel').textContent='Delete';
 $('main').classList.add('hide');$('pdetail').classList.add('hide');$('detail').classList.remove('hide');window.scrollTo(0,0)}
function close(){if(cur){cur.title=$('dTitle').value.trim()||cur.title;cur.desc=$('dDesc').value;cur.due=$('dDue').value;cur.proj=$('dProj').value;
  if(cur.due&&view==='cal'){sel=cur.due;const[y,m]=cur.due.split('-').map(Number);month=new Date(y,m-1,1)}save()}
 cur=null;$('detail').classList.add('hide');if(backP&&curP){$('pdetail').classList.remove('hide');drawProj()}else{$('main').classList.remove('hide');render()}}
$('back').onclick=close;
$('dDone').onclick=()=>{cur.done=!cur.done;close()};
$('dDel').onclick=()=>{if(!armed){armed=true;$('dDel').textContent='Tap again to delete';return}armed=false;$('dDel').textContent='Delete';tasks=tasks.filter(x=>x!==cur);cur=null;save();close()};
function projHtml(){
 if(!projects.length)return '<div class="empty">No projects yet. Type a name above and tap Add.</div>';
 return projects.map(p=>{const ts=tasks.filter(t=>t.proj===p.id),d=ts.filter(t=>t.done).length;
  return `<div class="task" data-popen="${p.id}" style="cursor:pointer"><span class="title">${esc(p.name)} ${p.desc?'<span class="dot">●</span>':''}<span class="due">${p.status}${p.due?' · '+nice(p.due):''} · ${d}/${ts.length} tasks</span></span><span class="chev">›</span></div>`}).join('')}
function openProj(id){curP=projects.find(p=>p.id===id);if(!curP)return;armedP=false;$('pDel').textContent='Delete project';
 $('pName').value=curP.name;$('pDesc').value=curP.desc||'';$('pStatus').value=curP.status||'Active';$('pDue').value=curP.due||'';$('pNotes').value=curP.notes||'';
 $('main').classList.add('hide');$('pdetail').classList.remove('hide');drawProj();window.scrollTo(0,0)}
function drawProj(){const ts=tasks.filter(t=>t.proj===curP.id),d=ts.filter(t=>t.done).length;
 $('pTitleH').textContent=curP.name;$('pBar').style.width=(ts.length?Math.round(d/ts.length*100):0)+'%';$('pProg').textContent=ts.length?d+' of '+ts.length+' tasks done':'No tasks yet';
 $('pTasks').innerHTML=ordered(ts).map(row).join('')||'<div class="empty">No tasks in this project.</div>'}
function saveProj(){if(!curP)return;curP.name=$('pName').value.trim()||curP.name;curP.desc=$('pDesc').value;curP.status=$('pStatus').value;curP.due=$('pDue').value;curP.notes=$('pNotes').value;saveP()}
function closeProj(){saveProj();curP=null;$('pdetail').classList.add('hide');$('main').classList.remove('hide');render()}
$('pBack').onclick=closeProj;
$('pdetail').onclick=e=>{const g=a=>e.target.closest('['+a+']');const k=g('data-tick'),s=g('data-star'),o=g('data-open'),z=g('data-zz'),sn=g('data-snz');
 if(k){const t=T(k.dataset.tick);t.done=!t.done;save();drawProj()}
 else if(s){const t=T(s.dataset.star);t.star=!t.star;save();drawProj()}
 else if(z){snz=z.dataset.zz;drawProj()}
 else if(sn){const[id,dd]=sn.dataset.snz.split(':');if(dd!=='x'){T(id).due=addDays(Number(dd));save()}snz=null;drawProj()}
 else if(o){saveProj();snz=null;openTask(o.dataset.open,true)}};
function addPT(){const v=$('pNew').value.trim();if(!v)return;tasks.unshift({id:Date.now().toString(36),title:v,desc:'',done:false,star:false,subs:[],due:'',proj:curP.id});$('pNew').value='';save();drawProj()}
$('pAdd').onclick=addPT;$('pNew').onkeydown=e=>{if(e.key==='Enter')addPT()};
$('pDel').onclick=()=>{if(!armedP){armedP=true;$('pDel').textContent='Tap again to delete';return}tasks.forEach(t=>{if(t.proj===curP.id)t.proj=''});projects=projects.filter(p=>p!==curP);curP=null;save();saveP();$('pdetail').classList.add('hide');$('main').classList.remove('hide');render()};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
